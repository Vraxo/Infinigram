name: Prediction benchmarks

on:
  push:
    branches: [main, "intelligence/**"]
    paths:
      - "benchmarks/Infinigram.Benchmarks/Model/**"
      - "benchmarks/Infinigram.Benchmarks/Core/**"
      - "benchmarks/Infinigram.Benchmarks/Runner/**"
      - "src/Infinigram/Model/**"
      - "Resources/Corpora/**/*.txt"
      - ".github/workflows/prediction-benchmarks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prediction-benchmarks:
    name: Prediction latency and allocations
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Run prediction benchmarks
        run: >-
          dotnet run --configuration Release
          --project benchmarks/Infinigram.Benchmarks/Infinigram.Benchmarks.csproj
          --
          --filter "*PredictionHotPathBenchmarks*"
          --artifacts ./BenchmarkDotNet.Artifacts

      - name: Evaluate held-out next-token prediction
        run: >-
          dotnet run --configuration Release
          --project benchmarks/Infinigram.Benchmarks/Infinigram.Benchmarks.csproj
          --
          --evaluate-prediction
          --sample-count 2048
          --output prediction-evaluation.csv

      - name: Evaluate paired transfer inference
        run: >-
          dotnet run --configuration Release
          --project benchmarks/Infinigram.Benchmarks/Infinigram.Benchmarks.csproj
          --
          --evaluate-transfer-inference
          --sample-count 2048
          --bootstrap-replicates 2000
          --seed 20261127
          --context-window 3
          --output transfer-inference.csv
          --report-output transfer-inference.md

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prediction-benchmark-results
          path: |
            BenchmarkDotNet.Artifacts
            prediction-evaluation.csv
            transfer-inference.csv
            transfer-inference.md
          if-no-files-found: warn
          retention-days: 30
